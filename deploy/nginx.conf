# COMPGame front door: Tailscale funnel -> nginx 127.0.0.1:8081 -> next :3000 / uvicorn :8080.
#
# start.ps1 launches nginx with:
#     nginx.exe -p <repo-root>\ -c deploy\nginx.conf
# PATH BASES ARE MIXED -- verified empirically 2026-11-04:
#   * "include" resolves against the CONFIG FILE's directory (deploy\)
#     -> so it is written "tools/nginx/conf/mime.types"
#   * everything else (pid, logs, temp paths, alias) resolves against the -p PREFIX
#     (the repo root) -> so those are written "deploy/..." / "frontend/..."
# This ONE committed file then works on dev and on the box with no templating.
#
# nginx-for-Windows is upstream's second-class port (select() model, one worker,
# labeled beta). Accepted at ~300-student load; the rollback is one funnel command
# (tailscale funnel --bg 3000). ASCII only.

worker_processes 1;                 # the Windows build gains nothing from more
pid         deploy/logs/nginx.pid;
error_log   deploy/logs/nginx-error.log warn;

events {
    worker_connections 256;         # far above the study's real concurrency
}

http {
    include      tools/nginx/conf/mime.types;   # resolved against deploy\ (conf dir)
    default_type application/octet-stream;
    access_log   deploy/logs/nginx-access.log;
    sendfile     on;
    keepalive_timeout 65;
    client_max_body_size 2m;        # probes/reflections/questionnaires are small text
    server_tokens off;              # no nginx/x.y.z in Server headers or error pages (red-team 2026-11-04)

    # Temp paths under the (gitignored) nginx tree, NOT the prefix default --
    # the prefix is the repo root and we do not want client_body_temp there.
    client_body_temp_path deploy/tools/nginx/temp/client_body;
    proxy_temp_path       deploy/tools/nginx/temp/proxy;
    fastcgi_temp_path     deploy/tools/nginx/temp/fastcgi;
    uwsgi_temp_path       deploy/tools/nginx/temp/uwsgi;
    scgi_temp_path        deploy/tools/nginx/temp/scgi;

    server {
        listen 127.0.0.1:8081;

        # API leg -> uvicorn. The funnel terminates TLS at the Tailscale edge, so
        # tell the app the scheme was https (same as the old direct-to-3000 path).
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;    # Socratic tutor turns run ~8-30s
        }

        # Built static assets, served straight off disk. Content-hashed, so a year
        # of immutable caching is safe; service.ps1 verify proves the served hash
        # matches the on-disk build on every watchdog tick.
        location /_next/static/ {
            alias frontend/.next/static/;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # Everything else -> next start.
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
